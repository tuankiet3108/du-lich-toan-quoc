<button type="button" class="btn" onclick="window.location.href='register.html'">
    Đăng kí ngay
</button>
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVEL.ECO - Đăng ký tài khoản</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Be Vietnam Pro', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
    padding: 20px;
}

.register-container {
    width: 100%;
    max-width: 480px;
    background: #fff;
    padding: 40px 30px;
    border-radius: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    text-align: center;
}

.brand-title {
    font-size: 32px;
    font-weight: 700;
    color: #d93829;
    margin-bottom: 5px;
    letter-spacing: 0.5px;
}

.page-title {
    font-size: 22px;
    font-weight: 700;
    color: #222;
    margin-bottom: 30px;
    text-align: left;
}

.form-group {
    margin-bottom: 20px;
    text-align: left;
}

.form-group input {
    width: 100%;
    height: 52px;
    padding: 0 16px;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
    font-size: 15px;
    background: #fff;
    color: #333;
    transition: border-color 0.2s;
}

.form-group input:focus {
    border-color: #d93829;
}

.form-group input::placeholder {
    color: #888;
}

.auth-links {
    margin: 25px 0;
    font-size: 14px;
    color: #555;
    text-align: center;
}

.auth-links span {
    display: block;
    color: #d93829;
    font-weight: 500;
    margin-bottom: 6px;
}

.auth-links a {
    color: #d93829;
    text-decoration: none;
    font-weight: 600;
}

.auth-links a:hover {
    text-decoration: underline;
}

.submit-btn {
    width: 100%;
    height: 56px;
    background: #d93829;
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background 0.2s;
}

.submit-btn:hover {
    background: #c23023;
}

.submit-btn span {
    font-size: 18px;
    font-weight: 700;
}
</style>
</head>

<body>

<div class="register-container">
    <div class="brand-title">TRAVEL.ECO</div>
    <div class="page-title">Đăng ký tài khoản</div>

    <form id="registerForm">
        <div class="form-group">
            <input type="text" id="fullname" placeholder="Họ và tên" required>
        </div>

        <div class="form-group">
            <input type="text" id="reg-email" placeholder="Số điện thoại hoặc email" required>
        </div>

        <div class="form-group">
            <input type="password" id="reg-password" placeholder="Mật khẩu" required>
        </div>

        <div class="form-group">
            <input type="password" id="confirm-password" placeholder="Nhập lại mật khẩu" required>
        </div>

        <div class="auth-links">
            <span>Tạo tài khoản</span>
            Đã có tài khoản? <a href="index.html">Đăng nhập ngay</a>
        </div>

        <button type="submit" class="submit-btn">
            TRAVEL.ECO <span style="font-weight: 300; font-size: 14px; border-left: 1px solid rgba(255,255,255,0.4); padding-left: 10px;">Đăng xuất / Hoàn tất</span>
        </button>
    </form>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(e) {
    e.preventDefault();
    
    const name = document.getElementById("fullname").value.trim();
    const pass = document.getElementById("reg-password").value;
    const confirmPass = document.getElementById("confirm-password").value;

    if (!name || !pass || !confirmPass) {
        alert("Vui lòng điền đầy đủ thông tin đăng ký!");
        return;
    }

    if (pass !== confirmPass) {
        alert("Mật khẩu nhập lại không khớp!");
        return;
    }

    alert("Đăng ký thành công!");
    window.location.href = "index.html"; // Quay lại trang đăng nhập sau khi đăng ký thành công
});
</script>

</body>
</html>
