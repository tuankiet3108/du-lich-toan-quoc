<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVEL.ECO - Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Be Vietnam Pro', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 100% 0%, #ffd0bc 0%, transparent 30%),
        #fbfbfb;
}

.container {
    width: 100%;
    max-width: 1100px;
    min-height: 650px;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 50px;
    padding: 20px;
    align-items: center;
}

/* Khối bên trái: Ảnh + Gradient hiệu ứng chuẩn theo hình gốc */
.left-panel {
    position: relative;
    width: 100%;
    height: 600px;
    border-radius: 28px;
    overflow: hidden;
    background-image: 
        linear-gradient(to bottom, transparent 40%, rgba(255, 114, 52, 0.75) 75%, rgba(125, 155, 185, 0.85) 100%),
        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1200');
    background-size: cover;
    background-position: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

.logo {
    position: absolute;
    top: 40px;
    left: 45px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #ff6a39;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.logo-icon {
    font-size: 24px;
    color: #ff6a39;
}

/* Khối bên phải: Form đăng nhập */
.right-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.header {
    text-align: center;
    margin-bottom: 40px;
}

.header h1 {
    font-size: 38px;
    font-weight: 700;
    color: #ff6a39;
    letter-spacing: -0.5px;
}

.header p {
    font-size: 20px;
    font-weight: 300;
    color: #333;
    margin-top: 6px;
}

.login-form {
    width: 100%;
    max-width: 360px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;
    font-size: 15px;
    font-weight: 700;
    color: #222;
    margin-bottom: 10px;
}

.required {
    color: #ff443b;
}

.input-box {
    position: relative;
}

.input-box input {
    width: 100%;
    height: 48px;
    padding: 0 45px 0 16px;
    border: 1px solid #ccc;
    border-radius: 12px;
    outline: none;
    background: #fff;
    font-size: 14px;
    color: #333;
    transition: border-color 0.2s;
}

.input-box input::placeholder {
    color: #aaa;
}

.input-box input:focus {
    border-color: #ff6a39;
}

.toggle-password {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    color: #777;
    user-select: none;
}

.forgot {
    display: block;
    text-align: right;
    margin-top: -8px;
    margin-bottom: 28px;
    color: #888;
    text-decoration: none;
    font-size: 13px;
}

.forgot:hover {
    color: #ff6a39;
}

.buttons {
    display: flex;
    justify-content: space-between;
    gap: 16px;
}

.btn {
    flex: 1;
    height: 46px;
    border: none;
    border-radius: 12px;
    background: #ff6a39;
    color: white;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
}

.btn:hover {
    background: #e65525;
}

.btn:active {
    transform: scale(0.98);
}

.divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 30px 0 24px;
    color: #999;
    font-size: 13px;
}

.divider::before,
.divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: #e0e0e0;
}

.google-btn {
    width: 90px;
    height: 46px;
    border: 1px solid #ccc;
    border-radius: 12px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    cursor: pointer;
    transition: background 0.2s;
}

.google-btn:hover {
    background: #f5f5f5;
}

.google-btn img {
    width: 22px;
    height: 22px;
}

/* Responsive cho thiết bị di động */
@media(max-width: 900px) {
    .container {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .left-panel {
        height: 250px;
    }

    .header h1 {
        font-size: 30px;
    }

    .header p {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- Bên trái: Hình ảnh và Logo -->
    <div class="left-panel">
        <div class="logo">
            <span class="logo-icon">⬡</span>
            <span>TRAVEL.ECO</span>
        </div>
    </div>

    <!-- Bên phải: Form đăng nhập -->
    <div class="right-panel">

        <div class="header">
            <h1>Du lịch toàn quốc</h1>
            <p>Trung tâm nhận thưởng</p>
        </div>

        <form class="login-form" id="loginForm">

            <div class="form-group">
                <label>Số điện thoại hoặc email <span class="required">(*)</span></label>
                <div class="input-box">
                    <input type="text" id="email" placeholder="Số điện thoại hoặc email" required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu <span class="required">(*)</span></label>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required>
                    <span class="toggle-password" onclick="togglePassword()" id="eye">👁</span>
                </div>
            </div>

            <a href="#" class="forgot" onclick="alert('Chức năng quên mật khẩu đang được phát triển!'); return false;">
                Forgot Password?
            </a>

            <div class="buttons">
                <!-- Nút Đăng kí ngay chuyển trang -->
                <button type="button" class="btn" onclick="window.location.href='register.html'">
                    Đăng kí ngay
                </button>

                <!-- Nút Đăng nhập gửi form và chuyển trang -->
                <button type="submit" class="btn">
                    Đăng nhập
                </button>
            </div>

            <div class="divider">or continue with</div>

            <button type="button" class="google-btn" onclick="alert('Đang kết nối Google Authentication...')">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            </button>

        </form>
    </div>
</div>

<script>
// Chức năng Ẩn/Hiện mật khẩu
function togglePassword() {
    const passwordInput = document.getElementById("password");
    passwordInput.type = passwordInput.type === "password" ? "text" : "password";
}

// Xử lý sự kiện đăng nhập và chuyển sang trang mới
document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        alert("Vui lòng nhập đầy đủ thông tin!");
        return;
    }

    // Chuyển sang trang đích sau khi đăng nhập thành công
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
